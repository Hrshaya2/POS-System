<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
    <link rel="apple-touch-icon" href="/icons/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Loyal Mobile POS - Point of Sale with offline support and automatic cloud sync" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Loyal POS" />
    <link rel="manifest" href="/manifest.json" />
    <title>Loyal Mobile POS - Point of Sale</title>
    <!--
      Apply the saved theme BEFORE the app renders. Without this the page paints
      light first and then snaps to dark, which is a jarring white flash on every
      reload. Kept inline and tiny on purpose; the real logic lives in
      src/hooks/useTheme.jsx and must stay in sync with STORAGE_KEY there.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pos_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) { /* storage blocked - fall back to light */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
